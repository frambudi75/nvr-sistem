services:
  nvr-core:
    build: .
    container_name: python-nvr
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./recordings:/recordings
      - ./config.json:/config.json
      - ./app:/app
    environment:
      - TZ=Asia/Jakarta # Adjust timezone as needed
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
